<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ - ፎቶዎች</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }
        /* ናቪጌሽን ባር */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .navbar a:hover, .navbar a.active {
            color: #2ecc71;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h3 {
            color: #1b365d;
            text-align: center;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .photo-item {
            text-align: center;
        }
        .photo-item img {
            width: 260px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .photo-item p {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f6f9; margin: 0;">
    
    <header style="background: #1b365d; color: white; padding: 15px; text-align: center;">
        <h2>ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ</h2>
    </header>
    
    <!-- Navigation Links -->
    <div class="navbar">
        <div class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="result.html">Check Result</a>
            <a href="photos.html" class="active">Photos</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <!-- Photos Gallery Section -->
    <div class="container">
        <h3>የትምህርት ቤቱ ማዕከላት እና መርሃ-ግብሮች ፎቶዎች</h3>
        
        <div class="photo-grid">
            <div class="photo-item">
                <img src="a.jpg" alt="School Event">
                <p>መርሃ-ግብር እና ክብረ በዓል</p>
            </div>
            <div class="photo-item">
                <img src="b.jpg" alt="School Banner">
                <p>የምረቃ እና ዝግጅት ሰንደቅ</p>
            </div>
            <div class="photo-item">
                <img src="c.jpg" alt="Graduation Students">
                <p>ተመራቂ ተማሪዎች</p>
            </div>
            <div class="photo-item">
                <img src="d.jpg" alt="Classroom Exam">
                <p>ክፍል ውስጥ ፈተና አሰጣጥ</p>
            </div>
            <div class="photo-item">
                <img src="e.jpg" alt="Students Studying">
                <p>ተማሪዎች በትምህርት ላይ</p>
            </div>
            <div class="photo-item">
                <img src="f.jpg" alt="School Trip">
                <p>የውጪ ጉብኝት እና ፎቶ</p>
            </div>
            <div class="photo-item">
                <img src="g.jpg" alt="Meeting Hall">
                <p>ጉባኤ እና ስብሰባ አዳራሽ</p>
            </div>
        </div>
    </div>

</body>
</html>
