<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ - መነሻ ገጽ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8b0000; /* ቀይ የጀርባ ቀለም (Dark Red / Crimson) */
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* ናቪጌሽን ባር */
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .navbar a:hover, .navbar a.active {
            color: #2ecc71;
        }
        #google_translate_element select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        /* ዋናው የይዘት ማዕከል */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-container img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background-color: #fff;
            object-fit: cover;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #f1f1f1;
        }
        /* ወደ ምዝገባ እና ውጤት መመልከቻ የሚወስዱ ቁልፎች */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #ffffff;
            color: #8b0000;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }
        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body>

<!-- ናቪጌሽን ባር እና የቋንቋ መራጫ -->
<div class="navbar">
    <div class="nav-links">
        <a href="homepage.html" class="active">Home</a>
        <a href="result.html">Check Result</a>
        <a href="photos.html">Photos</a>
        <a href="contact.html">Contact</a>
    </div>
    <div id="google_translate_element"></div>
</div>

<!-- መነሻ ገጽ ላይ የሚታየው ሎጎ እና  እንኳን ደህና መጡ መልእክት -->
<div class="main-content">
    <div class="logo-container">
        <!-- ሎጎው የሚገኝበትን ትክክለኛ ስም (logo.png) እዚህ ላይ አስገብተናል -->
        <img src="logo.png" alt="ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ ሎጎ">
    </div>
    
    <h1>ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ</h1>
    <p>እንኳን ወደ ትምህርት ቤታችን ኦፊሴላዊ መተግበሪያ በሰላም መጡ!</p>

    <div class="btn-group">
        <a href="result.html" class="btn btn-outline">ውጤት ይፈትሹ (Check Result)</a>
    </div>
</div>

<!-- የጉግል ትርጉም ስክሪፕት -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'am', includedLanguages: 'am,en,om,ti', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
