<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ደብረ ምህረት ቅዱስ ሚካኤል አከዳሚ - Result Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .header-top {
            background-color: #1a3b65;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .navbar {
            background-color: #2c4a6f;
            padding: 12px 30px;
            display: flex;
            gap: 25px;
        }
        .navbar a {
            color: #d1e7dd;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }
        .navbar a.active {
            color: #28a745;
        }
        .navbar a:hover {
            color: white;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 5px;
        }
        .school-subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            background-color: #8b0000;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #a52a2a;
        }
        #resultBox {
            margin-top: 25px;
            padding: 20px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: none;
        }
        #resultBox h3 {
            color: #1a3b65;
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }
        #resultBox p {
            font-size: 16px;
            margin: 12px 0;
            color: #333;
        }
        .file-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
        }
        .file-btn:hover {
            background-color: #218838;
        }
        .error-msg {
            color: red;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-top">
        ደብረ ምህረት ቅዱስ ሚካኤል አከዳሚ
    </div>

    <div class="navbar">
        <a href="homepage.html">Home</a>
        <a href="result.html" class="active">Check Result</a>
        <a href="contact.html">contact</a>
        <a href="photos.html">photos</a>
    </div>

    <div class="container">
        <h2>የተማሪዎች ውጤት ማመልከቻ</h2>
        <div class="school-subtitle">ደብረ ምህረት ቅዱስ ሚካኤል አከዳሚ</div>

        <div class="form-group">
            <label for="searchId">የተማሪ መለያ ቁጥር (Student ID) ያስገቡ *</label>
            <input type="text" id="searchId" placeholder="ምሳሌ:- SMS-2026-001">
        </div>

        <div class="form-group">
            <label for="searchName">የተማሪ ሙሉ ስም (Full Name) *</label>
            <input type="text" id="searchName" placeholder="ስም እና የአባት ስም ያስገቡ">
        </div>

        <button onclick="checkResult()">ውጤት አሳይ (Search Result)</button>

        <div id="errorMsg" class="error-msg"></div>

        <!-- ውጤቱ የሚወጣበት ቦክስ (ክፍል እና ሴክሽንን ጨምሮ) -->
        <div id="resultBox">
            <h3>የተማሪው ውጤት እና ዝርዝር መረጃ</h3>
            <p><b>ስም:-</b> <span id="resName"></span></p>
            <p><b>መለያ ቁጥር:-</b> <span id="resId"></span></p>
            <p><b>ክፍል (Grade):-</b> <span id="resGrade"></span></p>
            <p><b>ሴክሽን (Section):-</b> <span id="resSection"></span></p>
            <p><b>የተማሪ ውጤት/ሰነድ:-</b></p>
            <div id="fileContainer">አልተያያዘም</div>
        </div>
    </div>

<script>
    async function checkResult() {
        const studentId = document.getElementById('searchId').value.trim();
        const searchName = document.getElementById('searchName').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.innerText = '';
        resultBox.style.display = 'none';

        if (!studentId || !searchName) {
            alert('እባክዎ መለያ ቁጥር እና ሙሉ ስም ያስገቡ!');
            return;
        }

        try {
            const response = await fetch(`http://localhost:3000/api/result/${studentId}`);
            const data = await response.json();

            if (!response.ok) {
                errorMsg.innerText = data.message || 'በዚህ መለያ ቁጥር የተገኘ ውጤት የለም።';
                return;
            }

            if (data.fullName.toLowerCase() !== searchName.toLowerCase()) {
                errorMsg.innerText = 'ያስገቡት ስም እና መለያ ቁጥር እርስ በእርስ አይመሳሰሉም!';
                return;
            }

            // መረጃዎችን በገጹ ላይ መሙላት (ክፍል እና ሴክሽን ጨምሮ)
            document.getElementById('resId').innerText = data.studentId;
            document.getElementById('resName').innerText = data.fullName;
            document.getElementById('resGrade').innerText = data.grade || 'አልተገለጸም';
            document.getElementById('resSection').innerText = data.section || 'አልተገለጸም';

            // ፋይል ካለ የማወረጃ ቁልፍ ማሳየት
            const fileContainer = document.getElementById('fileContainer');
            if (data.fileData && data.fileName) {
                fileContainer.innerHTML = `<a href="${data.fileData}" download="${data.fileName}" class="file-btn">📥 ፋይል አውርድ (${data.fileName})</a>`;
            } else {
                fileContainer.innerHTML = '<span>አልተያያዘም</span>';
            }

            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.innerText = 'ሰርቨር ጋር መገናኘት አልተቻለም: ' + err.message;
        }
    }
</script>

</body>
</html>
