<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">የተማሪዎች መረጃ እና ሪሲፕት ማመላከቻ - Saint Michael School</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #1e3a8a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .lang-switch select {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button.search-btn {
            width: 100%;
            background-color: #8b0000;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button.search-btn:hover {
            background-color: #a52a2a;
        }
        #errorMsg {
            color: red;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .result-card {
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: none;
        }
        .result-card h3 {
            margin-top: 0;
            color: #1e3a8a;
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 15px;
        }
        .result-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

        
    <header style="background: #1b365d; color: white; padding: 15px; text-align: center;">
        <h2>ደብረ ምሕረት ቅዱስ ሚካኤል አካዳሚ</h2>
    </header>

    <nav>
        <div class="nav-links">
            <a href="homepage.html" data-am="መነሻ" data-en="Home">መነሻ</a>
            <a href="result.html" data-am="ውጤት/ሪሲፕት" data-en="Check Result">ውጤት/ሪሲፕት</a>
            <a href="contact.html" data-am="ያግኙን" data-en="Contact">ያግኙን</a>
            <a href="photos.html" data-am="ፎቶዎች" data-en="Photos">ፎቶዎች</a>
        </div>
        <div class="lang-switch">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="am"> አማርኛ</option>
                <option value="en"> English</option>
            </select>
        </div>
    </nav>

    <div class="container">
        <h2 id="mainHeading">የተማሪዎች መረጃ እና ሪሲፕት ማመላከቻ</h2>
        <div class="form-group">
            <label for="studentId" id="labelId">የተማሪ መለያ ቁጥር (Student ID) *</label>
            <input type="text" id="studentId" placeholder="ለምሳሌ፡ sms 1">
        </div>

        <div class="form-group">
            <label for="searchName" id="labelName">የተማሪ ሙሉ ስም (Full Name) *</label>
            <input type="text" id="searchName" placeholder="የተማሪውን ሙሉ ስም ያስገቡ">
        </div>

        <button class="search-btn" onclick="checkResult()" id="searchBtn">መረጃ ፈልግ (Search)</button>

        <div id="errorMsg"></div>

        <!-- ሪሲፕት ምስሉን እና መረጃውን የሚያሳይ ካርድ -->
        <div id="resultCard" class="result-card">
            <h3 id="cardTitle">የተማሪ ምዝገባ እና የባንክ ሪሲፕት</h3>
            <div class="result-row"><span id="tId">መለያ ቁጥር (ID):</span> <strong id="resId"></strong></div>
            <div class="result-row"><span id="tName">ሙሉ ስም:</span> <strong id="resName"></strong></div>
            <div class="result-row"><span id="tGrade">ክፍል (Grade & Section):</span> <strong id="resGradeSec"></strong></div>
            <div class="result-row"><span id="tFile">የባንክ ሪሲፕት ስም:</span> <strong id="resFileName"></strong></div>
            
            <!-- የባንክ ሪሲፕት ምስል የሚታይበት ቦታ -->
            <div style="margin-top: 20px; text-align: center;">
                <p id="tReceiptLabel" style="font-weight: bold; color: #1e3a8a; margin-bottom: 10px;">የባንክ ማረጋገጫ ሪሲፕት (Bank Receipt Image):</p>
                <img id="resReceiptImg" src="" alt="Bank Receipt" style="max-width: 100%; height: auto; border: 1px solid #ccc; border-radius: 5px; display: none;">
                <p id="noReceiptText" style="color: #777; display: none;">ምንም ሪሲፕት ፋይል አልተገኘም</p>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            am: {
                pageTitle: "የተማሪዎች መረጃ እና ሪሲፕት ማመላከቻ - Saint Michael School",
                mainHeading: "የተማሪዎች መረጃ እና ሪሲፕት ማመላከቻ",
                subHeading: "ሰይንት ሚካኤል ቅድስት ማርያም አክሱም",
                labelId: "የተማሪ መለያ ቁጥር (Student ID) *",
                placeholderId: "ለምሳሌ፡ sms 1",
                labelName: "የተማሪ ሙሉ ስም (Full Name) *",
                placeholderName: "የተማሪውን ሙሉ ስም ያስገቡ",
                searchBtn: "መረጃ ፈልግ (Search)",
                cardTitle: "የተማሪ ምዝገባ እና የባንክ ሪሲፕት",
                tId: "መለያ ቁጥር (ID):",
                tName: "ሙሉ ስም:",
                tGrade: "ክፍል (Grade & Section):",
                tFile: "የባንክ ሪሲፕት ስም:",
                tReceiptLabel: "የባንክ ማረጋገጫ ሪሲፕት (Bank Receipt Image):",
                noReceiptText: "ምንም ሪሲፕት ፋይል አልተገኘም",
                emptyFieldsError: "እባክዎ መታወቂያ ቁጥር እና ሙሉ ስም ያስገቡ!",
                notFoundError: "የተማሪው መረጃ አልተገኘም!",
                serverError: "ከሰርቨር ጋር መገናኘት አልተቻለም (NetworkError)"
            },
            en: {
                pageTitle: "Student Info & Receipt Portal - Saint Michael School",
                mainHeading: "Student Info & Receipt Portal",
                subHeading: "Saint Michael St. Mary Aksum",
                labelId: "Student ID *",
                placeholderId: "e.g. sms 1",
                labelName: "Full Name *",
                placeholderName: "Enter student full name",
                searchBtn: "Search Result",
                cardTitle: "Student Registration & Bank Receipt",
                tId: "Student ID:",
                tName: "Full Name:",
                tGrade: "Grade & Section:",
                tFile: "Bank Receipt File Name:",
                tReceiptLabel: "Bank Receipt Image:",
                noReceiptText: "No receipt file found",
                emptyFieldsError: "Please enter both Student ID and Full Name!",
                notFoundError: "Student information not found!",
                serverError: "Could not connect to server (NetworkError)"
            }
        };

        let currentLang = 'am';

        function changeLanguage() {
            const select = document.getElementById('langSelect');
            currentLang = select.value;
            const t = translations[currentLang];

            // Navbar links translation
            document.querySelectorAll('nav .nav-links a').forEach(a => {
                a.innerText = a.getAttribute(`data-${currentLang}`);
            });

            // Page texts translation
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('mainHeading').innerText = t.mainHeading;
            document.getElementById('subHeading').innerText = t.subHeading;
            document.getElementById('labelId').innerText = t.labelId;
            document.getElementById('studentId').placeholder = t.placeholderId;
            document.getElementById('labelName').innerText = t.labelName;
            document.getElementById('searchName').placeholder = t.placeholderName;
            document.getElementById('searchBtn').innerText = t.searchBtn;
            document.getElementById('cardTitle').innerText = t.cardTitle;
            document.getElementById('tId').innerText = t.tId;
            document.getElementById('tName').innerText = t.tName;
            document.getElementById('tGrade').innerText = t.tGrade;
            document.getElementById('tFile').innerText = t.tFile;
            document.getElementById('tReceiptLabel').innerText = t.tReceiptLabel;
            document.getElementById('noReceiptText').innerText = t.noReceiptText;
        }

        async function checkResult() {
            const studentId = document.getElementById('studentId').value.trim();
            const searchName = document.getElementById('searchName').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard');
            const receiptImg = document.getElementById('resReceiptImg');
            const noReceiptText = document.getElementById('noReceiptText');
            const t = translations[currentLang];

            errorMsg.innerText = '';
            resultCard.style.display = 'none';
            receiptImg.style.display = 'none';
            noReceiptText.style.display = 'none';

            if (!studentId || !searchName) {
                errorMsg.innerText = t.emptyFieldsError;
                return;
            }

            try {
                const response = await fetch('/api/result', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ studentId: studentId, fullName: searchName })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMsg.innerText = data.error || t.notFoundError;
                    return;
                }

                // መረጃዎችን መሙላት
                document.getElementById('resId').innerText = data.studentId || '-';
                document.getElementById('resName').innerText = data.fullName || '-';
                document.getElementById('resGradeSec').innerText = `${data.grade || ''} ${data.section || ''}`;
                document.getElementById('resFileName').innerText = data.receiptFileName || (currentLang === 'am' ? 'አልተገኘም' : 'Not Found');

                // የባንክ ሪሲፕት ምስል ካለ ማሳየት
                if (data.receiptFileData) {
                    receiptImg.src = data.receiptFileData;
                    receiptImg.style.display = 'block';
                } else {
                    noReceiptText.style.display = 'block';
                }

                resultCard.style.display = 'block';

            } catch (error) {
                console.error('ስህተት ተፈጥሯል:', error);
                errorMsg.innerText = t.serverError;
            }
        }
    </script>
</body>
</html>
