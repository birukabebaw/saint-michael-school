<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Saint Michael School</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #1e3a8a;
            color: white;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #8b0000;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #a52a2a;
        }
        #errorMsg {
            color: red;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .result-card {
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: none;
        }
        .result-card h3 {
            margin-top: 0;
            color: #1e3a8a;
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 15px;
        }
        .result-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <nav>
        <a href="homepage.html">Home</a>
        <a href="result.html">Check Result</a>
        <a href="contact.html">contact</a>
        <a href="photos.html">photos</a>
    </nav>

    <div class="container">
        <h2>የተማሪዎች ውጤት ማመላከቻ</h2>

        <div class="form-group">
            <label for="studentId">የተማሪ መለያ ቁጥር (Student ID) *</label>
            <input type="text" id="studentId" placeholder="ለምሳሌ፡ sms 1">
        </div>

        <div class="form-group">
            <label for="searchName">የተማሪ ሙሉ ስም (Full Name) *</label>
            <input type="text" id="searchName" placeholder="የተማሪውን ሙሉ ስም ያስገቡ">
        </div>

        <button onclick="checkResult()">ውጤት አሳይ (Search Result)</button>

        <div id="errorMsg"></div>

        <div id="resultCard" class="result-card">
            <h3>የተማሪ ውጤት ዝርዝር</h3>
            <div class="result-row"><span>መለያ ቁጥር (ID):</span> <strong id="resId"></strong></div>
            <div class="result-row"><span>ሙሉ ስም:</span> <strong id="resName"></strong></div>
            <div class="result-row"><span>ክፍል (Grade & Section):</span> <strong id="resGradeSec"></strong></div>
            <div class="result-row"><span>ሂሳብ (Maths):</span> <strong id="resMaths"></strong></div>
            <div class="result-row"><span>እንግሊዝኛ (English):</span> <strong id="resEnglish"></strong></div>
            <div class="result-row"><span>አማርኛ (Amharic):</span> <strong id="resAmharic"></strong></div>
            <div class="result-row"><span>ድምር (Total):</span> <strong id="resTotal"></strong></div>
            <div class="result-row"><span>አማካኝ (Average):</span> <strong id="resAverage"></strong></div>
            <div class="result-row"><span>ደረጃ (Rank):</span> <strong id="resRank"></strong></div>
        </div>
    </div>

    <script>
        async function checkResult() {
            const studentId = document.getElementById('studentId').value.trim();
            const searchName = document.getElementById('searchName').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard');

            // ከዚህ ቀደም የነበረውን መልእክት ወይም ውጤት ማጽዳት
            errorMsg.innerText = '';
            resultCard.style.display = 'none';

            if (!studentId || !searchName) {
                errorMsg.innerText = 'እባክዎ መታወቂያ ቁጥር እና ሙሉ ስም ያስገቡ!';
                return;
            }

            try {
                const response = await fetch('/api/result', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ studentId: studentId, fullName: searchName })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMsg.innerText = data.error || 'የተማሪው መረጃ አልተገኘም!';
                    return;
                }

                // የተገኘውን መረጃ በ HTML ካርዱ ላይ መሙላት
                document.getElementById('resId').innerText = data.studentId || '-';
                document.getElementById('resName').innerText = data.fullName || '-';
                document.getElementById('resGradeSec').innerText = `${data.grade || ''} ${data.section || ''}`;
                document.getElementById('resMaths').innerText = data.maths || '-';
                document.getElementById('resEnglish').innerText = data.english || '-';
                document.getElementById('resAmharic').innerText = data.amharic || '-';
                document.getElementById('resTotal').innerText = data.total || '-';
                document.getElementById('resAverage').innerText = data.average || '-';
                document.getElementById('resRank').innerText = data.rank || '-';

                // የውጤት ካርዱን ማሳየት
                resultCard.style.display = 'block';

            } catch (error) {
                console.error('ስህተት ተፈጥሯል:', error);
                errorMsg.innerText = 'ከሰርቨር ጋር መገናኘት አልተቻለም (NetworkError)';
            }
        }
    </script>
</body>
</html>
